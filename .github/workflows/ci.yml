name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Smoke tests (visual rendering, jsdom)
        run: npm run test:smoke

      - name: Unit tests (mocha)
        run: npm run test:unit

      - name: Package visual
        run: npx pbiviz package

      - name: Upload pbiviz artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibcs-charts-pbiviz
          path: dist/*.pbiviz
          if-no-files-found: error
